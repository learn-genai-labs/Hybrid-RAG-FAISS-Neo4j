services:
  neo4j:
    image: neo4j:5-community
    container_name: hybrid-rag-neo4j
    restart: unless-stopped

    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}

    volumes:
      - hybrid_rag_neo4j_data:/data
      - hybrid_rag_neo4j_logs:/logs

    ports:
      - "7475:7474"
      - "7688:7687"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:7474 || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 15

    networks:
      - hybrid_rag_network

  hybrid-rag-app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: hybrid-rag-app
    restart: unless-stopped

    env_file:
      - .env

    environment:
      NEO4J_URI: bolt://neo4j:7687

    volumes:
      - ./data/uploads:/app/data/uploads
      - ./backend/vector_store/faiss_index:/app/backend/vector_store/faiss_index

    ports:
      - "8501:8501"

    depends_on:
      neo4j:
        condition: service_healthy

    networks:
      - hybrid_rag_network

networks:
  hybrid_rag_network:
    name: hybrid-rag-network

volumes:
  hybrid_rag_neo4j_data:
    name: hybrid-rag-neo4j-data

  hybrid_rag_neo4j_logs:
    name: hybrid-rag-neo4j-logs